name: Auto-build llama.cpp server-cuda

on:
  schedule:
    - cron: '0 * * * *' # Polls every hour (adjust if you want it less frequent, e.g., '0 2 * * *' for daily)
  workflow_dispatch:    # Allows you to click "Run workflow" manually from the Actions tab

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: ggml-org/llama.cpp # Official upstream repository

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Set lower-case image name
        run: |
          # Docker image names must be entirely lowercase
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$OWNER_LC/llama.cpp-server-cuda" >> $GITHUB_ENV

      - name: Get latest release tag from upstream
        id: get_tag
        run: |
          # Fetch the latest release tag from the official repo API
          LATEST_TAG=$(curl -sL https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "Error fetching the latest tag. (API rate limit or repo missing?)"
            exit 1
          fi
          echo "Latest upstream tag is: $LATEST_TAG"
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub Actions

      - name: Check if image for this tag already exists
        id: check_image
        run: |
          # The 'if' construct natively handles the non-zero exit code if the tag doesn't exist
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }} > /dev/null 2>&1; then
            echo "Image for tag ${{ env.LATEST_TAG }} already exists in GHCR. Skipping build."
            echo "build_needed=false" >> $GITHUB_ENV
          else
            echo "Image for tag ${{ env.LATEST_TAG }} not found. Proceeding with build."
            echo "build_needed=true" >> $GITHUB_ENV
          fi

      - name: Checkout upstream llama.cpp code
        if: env.build_needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.LATEST_TAG }}
          # This checks out the code straight into the Actions runner.
          # It does NOT clone the repo into your git tree.

      - name: Set up Docker Buildx
        if: env.build_needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.build_needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          # Using the official upstream Dockerfile and targeting the server build 
          file: .devops/cuda.Dockerfile
          target: server 
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Optional: You can specify target compute capability to speed up build times
          # build-args: |
          #   CUDA_DOCKER_ARCH=all
